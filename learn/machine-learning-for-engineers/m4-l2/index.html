 in their applicant dashboard.\",\"date\":\"2027-01-10\"},{\"title\":\"Pay and enrol\",\"body\":\"Pay the first instalment to confirm your seat and get access to the learning platform.\",\"date\":\"2027-02-06\"}],\"faqs\":[{\"question\":\"Will I get an IIT Hyderabad certificate?\",\"answer\":\"Yes. Learners who meet the attendance and assessment requirements receive a certificate issued by the Centre for Continuing Education, IIT Hyderabad.\"},{\"question\":\"Can I attend if I miss a live class?\",\"answer\":\"Every live session is recorded and available on the learning platform within 24 hours.\"},{\"question\":\"Is there an instalment option?\",\"answer\":\"Yes. You can pay in up to three instalments without extra charge. Details are in your offer letter.\"}],\"facultyIds\":[\"f-menon\",\"f-iyer\"]},\"course\":{\"programSlug\":\"machine-learning-for-engineers\",\"modules\":[{\"id\":\"m1\",\"title\":\"Mathematics for ML\",\"lessons\":[{\"id\":\"m1-l1\",\"title\":\"Introduction to mathematics for ml\",\"kind\":\"video\",\"minutes\":20,\"body\":[\"Linear algebra, probability and optimisation, refreshed.\"]},{\"id\":\"m1-l2\",\"title\":\"Matrix calculus\",\"kind\":\"reading\",\"minutes\":15,\"body\":[\"Notes and worked examples on matrix calculus.\"]},{\"id\":\"m1-l3\",\"title\":\"Probability\",\"kind\":\"reading\",\"minutes\":15,\"body\":[\"Notes and worked examples on probability.\"]}]},{\"id\":\"m2\",\"title\":\"Supervised learning\",\"lessons\":[{\"id\":\"m2-l1\",\"title\":\"Introduction to supervised learning\",\"kind\":\"video\",\"minutes\":20,\"body\":[\"Regression, classification and model selection.\"]},{\"id\":\"m2-l2\",\"title\":\"Linear and logistic models\",\"kind\":\"reading\",\"minutes\":15,\"body\":[\"Notes and worked examples on linear and logistic models.\"]},{\"id\":\"m2-l3\",\"title\":\"Trees and ensembles\",\"kind\":\"reading\",\"minutes\":15,\"body\":[\"Notes and worked examples on trees and ensembles.\"]}]},{\"id\":\"m3\",\"title\":\"Deep learni
