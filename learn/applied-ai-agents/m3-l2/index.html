"children\":\"$L15\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$L16\",null,{\"children\":[\"$\",\"$12\",null,{\"name\":\"Next.Metadata\",\"children\":\"$L17\"}]}]}],[\"$\",\"meta\",null,{\"name\":\"next-size-adjust\",\"content\":\"\"}]]}]\nf:[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0ut6vhfiq0p9g.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]\n18:I[15546,[\"/_next/static/chunks/3l6bwague00l7.js\",\"/_next/static/chunks/3bjde919gzrp6.js\",\"/_next/static/chunks/2kp5np03icak7.js\",\"/_next/static/chunks/0f_pdoygiviu9.js\",\"/_next/static/chunks/1p0b4x5zcotdu.js\"],\"LessonPlayer\"]\nc:C\n10:[\"$\",\"$L18\",null,{\"program\":{\"id\":\"p-applied-ai\",\"slug\":\"applied-ai-agents\",\"title\":\"Applied AI: build AI agents that actually work\",\"tagline\":\"Design, build and evaluate reliable AI agents in guided weekend labs with IITH faculty.\",\"summary\":\"A professional certificate for software engineers who want to ship production-grade AI agents: retrieval, tool use, evaluation, guardrails and deployment.\",\"area\":\"ai\",\"level\":\"certificate\",\"mode\":\"live-online\",\"department\":\"Computer Science and Engineering\",\"overview\":[\"Most AI demos break the moment real users touch them. This program is about the engineering that comes after the demo: grounding agents in your data, giving them tools, measuring whether they are right, and keeping them safe and affordable in production.\",\"Each module ends with a lab you build on your own laptop and a review from teaching assistants. By the capstone you will have shipped an agent for a real workflow from your organisation or one of ours.\"],\"highlights\":[{\"title\":\"Weekend live classes\",\"body\":\"Saturday and Sunday mornings, so you can keep working full time.\"},{\"title\":\"12 guided labs\",\"body\":\"Hands-on builds with code reviews from IITH teaching assistants.\"},{\"title\":\"Capstone with industry mentors\",\"body\":\"Ship an agent for a real workflow and present it to a panel.\"},{\"title\":\"Two days on campus\",\"body\":\"Optional immersion at IIT Hyderabad, Kandi, at the end of the program.\"}],\"outcomes\":[\"Build retrieval-augmented agents over your own documents and databases\",\"Design tool-calling and multi-step agent workflows that fail safely\",\"Evaluate agents with test suites, LLM judges and human review\",\"Deploy and monitor agents with cost, latency and safety budgets\"],\"audience\":\"Software engineers, data scientists and technical leads with at least one year of programming experience in Python.\",\"duration\":\"6 months\",\"weeklyEffort\":\"6 to 8 hours a week\",\"credits\":8,\"startDate\":\"2027-01-16\",\"applicationDeadline\":\"2026-11-30\",\"seats\":120,\"feeINR\":145000,\"applicationFeeINR\":1000,\"feeNote\":\"Plus 18% GST. Pay in up to three instalments. 10% off for IITH alumni and groups of three or more.\",\"applicationsOpen\":true,\"curriculum\":[{\"title\":\"Foundations of large language models\",\"duration\":\"Weeks 1 to 3\",\"summary\":\"How LLMs work, where they fail, and prompting as interface design.\",\"topics\":[\"Tokens and context windows\",\"Prompt patterns\",\"Structured outputs\"]},{\"title\":\"Retrieval and grounding\",\"duration\":\"Weeks 4 to 7\",\"summary\":\"Connect models to your own knowledge, safely and measurably.\",\"topics\":[\"Embeddings and vector search\",\"Chunking strategies\",\"Citations and grounding checks\"]},{\"title\":\"Tools and agents\",\"duration\":\"Weeks 8 to 12\",\"summary\":\"Let models act: tool calling, planning and multi-agent patterns.\",\"topics\":[\"Tool design\",\"Agent loops\",\"Human-in-the-loop\"]},{\"title\":\"Evaluation and safety\",\"duration\":\"Weeks 13 to 17\",\"summary\":\"Know whether your agent is right before your users do.\",\"topics\":[\"Test sets and LLM judges\",\"Red-teaming\",\"Guardrails\"]},{\"title\":\"Production and capstone\",\"duration\":\"Weeks 18 to 24\",\"summary\":\"Deploy, monitor and present a capstone agent.\",\"topics\":[\"Latency and cost budgets\",\"Observability\",\"Capstone review\"]}],\"tools\":[\"Python\",\"PyTorch\",\"LangGraph\",\"PostgreSQL + pgvector\",\"Docker\",\"GitHub Actions\"],\"eligibility\":[\"A bachelor’s degree in engineering, science, mathematics or computer applications, with at least 55% or 5.5 CGPA.\",\"At least one year of programming experience in Python. No machine learning background is required.\",\"Final-year undergraduate students may apply and join if they graduate before the program starts.\"],\"admissionSteps\":[{\"title\":\"Apply online\",\"body\":\"About 15 minutes. Upload your degree certificate and a short statement.\",\"date\":\"2026-11-30\"},{\"title\":\"Profile review\",\"body\":\"Faculty review your academic and work background. Some programs add a short online test.\"},{\"title\":\"Offer letter\",\"body\":\"Selected applicants receive an offer by email and in their applicant dashboard.\",\"date\":\"2026-12-15\"},{\"title\":\"Pay and enrol\",\"body\":\"Pay the first instalment to confirm your seat and get access to the learning platform.\",\"date\":\"2027-01-16\"}],\"faqs\":[{\"question\":\"Do I need a GPU?\",\"answer\":\"No. Labs run on a laptop with 8 GB of RAM. Heavier exercises use cloud credits included in the fee.\"},{\"question\":\"Will I get an IIT Hyderabad certificate?\",\"answer\":\"Yes. Learners who meet the attendance and assessment requirements receive a certificate issued by the Centre for Continuing Education, IIT Hyderabad.\"},{\"question\":\"Can I attend if I miss a live class?\",\"answer\":\"Every live session is recorded and available on the learning platform within 24 hours.\"},{\"question\":\"Is there an instalment option?\",\"answer\":\"Yes. You can pay in up to three instalments without extra charge. Details are in your offer letter.\"}],\"facultyIds\":[\"f-rao\",\"f-menon\",\"f-iyer\"],\"featured\":true},\"course\":{\"programSlug\":\"applied-ai-agents\",\"modules\":[{\"id\":\"m1\",\"title\":\"Foundations of large language models\",\"lessons\":[{\"id\":\"m1-l1\",\"title\":\"What a language model actually predicts\",\"kind\":\"video\",\"minutes\":18,\"body\":[\"A language model is trained to predict the next token given the tokens before it. Everything else, from answering questions to writing code, is built on that one skill.\",\"In this lesson we look at tokens, context windows and sampling, and why the same prompt can give different answers.\"]},{\"id\":\"m1-l2\",\"title\":\"Prompts as interface design\",\"kind\":\"reading\",\"minutes\":12,\"body\":[\"Treat a prompt the way you would treat an API contract. State the role, the task, the inputs, the format of the output, and what to do when the task cannot be done.\",\"Structured outputs (JSON with a schema) turn a model from a writer into a component you can test.\"]},{\"id\":\"m1-l3\",\"title\":\"Check your understanding\",\"kind\":\"quiz\",\"minutes\":8,\"body\":[\"Three questions on tokens, context and structured outputs.\"],\"questions\":[{\"prompt\":\"Why can the same prompt give different answers on two runs?\",\"choices\":[{\"text\":\"The model is retrained between calls\"},{\"text\":\"Tokens are sampled from a probability distribution\",\"correct\":true},{\"text\":\"The context window changes size\"}],\"explanation\":\"With temperature above zero, each next token is sampled, so different paths are possible.\"},{\"prompt\":\"What happens to text beyond the context window?\",\"choices\":[{\"text\":\"The model cannot see it\",\"correct\":true},{\"text\":\"It is compressed automatically\"},{\"text\":\"It is stored for the next call\"}],\"explanation\":\"Anything outside the window is simply not part of the input.\"},{\"prompt\":\"Main benefit of structured outputs in an application?\",\"choices\":[{\"text\":\"Shorter answers\"},{\"text\":\"Output you can validate and test like any other API\",\"correct\":true},{\"text\":\"Lower cost per token\"}],\"explanation\":\"A schema gives you something to validate, which makes failures visible.\"}]}]},{\"id\":\"m2\",\"title\":\"Retrieval and grounding\",\"lessons\":[{\"id\":\"m2-l1\",\"title\":\"Embeddings and vector search\",\"kind\":\"video\",\"minutes\":22,\"body\":[\"How text becomes vectors, and how nearest-neighbour search finds relevant passages.\"]},{\"id\":\"m2-l2\",\"title\":\"Chunking strategies that work\",\"kind\":\"reading\",\"minutes\":15,\"body\":[\"Chunk by meaning, not by character count. Keep headings with their paragraphs, and store where each chunk came from.\"]},{\"id\":\"m2-l3\",\"title\":\"Lab: a grounded Q\u0026A agent\",\"kind\":\"reading\",\"minutes\":90,\"body\":[\"Build an agent that answers questions over the IITH academic handbook and cites the page it used.\"]},{\"id\":\"m2-l4\",\"title\":\"Live session: office hours with Dr. Rao\",\"kind\":\"live\",\"minutes\":60,\"body\":[\"Bring your lab questions. Recording available within 24 hours.\"]}]},{\"id\":\"m3\",\"title\":\"Tools and agents\",\"lessons\":[{\"id\":\"m3-l1\",\"title\":\"Designing tools a model can use\",\"kind\":\"video\",\"minutes\":20,\"body\":[\"Good tools have clear names, narrow purposes and error messages a model can act on.\"]},{\"id\":\"m3-l2\",\"title\":\"The agent loop\",\"kind\":\"video\",\"minutes\":24,\"body\":[\"Plan, act, observe, repeat, and how to stop an agent that is going in circles.\"]},{\"id\":\"m3-l3\",\"title\":\"Human in the loop\",\"kind\":\"reading\",\"minutes\":14,\"body\":[\"Where to ask a person for approval, and how to make that fast.\"]}]}]},\"lessonId\":\"m3-l2\"}]\n15:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}],[\"$\",\"meta\",\"2\",{\"name\":\"theme-color\",\"content\":\"#ffffff\",\"media\":\"(prefers-color-scheme: light)\"}],[\"$\",\"meta\",\"3\",{\"name\":\"theme-color\",\"content\":\"#0e0f2b\",\"media\":\"(prefers-color-scheme: dark)\"}]]\n19:I[43
