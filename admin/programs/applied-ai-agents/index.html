certificate for software engineers who want to ship production-grade AI agents: retrieval, tool use, evaluation, guardrails and deployment.\",\"area\":\"ai\",\"level\":\"certificate\",\"mode\":\"live-online\",\"department\":\"Computer Science and Engineering\",\"overview\":[\"Most AI demos break the moment real users touch them. This program is about the engineering that comes after the demo: grounding agents in your data, giving them tools, measuring whether they are right, and keeping them safe and affordable in production.\",\"Each module ends with a lab you build on your own laptop and a review from teaching assistants. By the capstone you will have shipped an agent for a real workflow from your organisation or one of ours.\"],\"highlights\":[{\"title\":\"Weekend live classes\",\"body\":\"Saturday and Sunday mornings, so you can keep working full time.\"},{\"title\":\"12 guided labs\",\"body\":\"Hands-on builds with code reviews from IITH teaching assistants.\"},{\"title\":\"Capstone with industry mentors\",\"body\":\"Ship an agent for a real workflow and present it to a panel.\"},{\"title\":\"Two days on campus\",\"body\":\"Optional immersion at IIT Hyderabad, Kandi, at the end of the program.\"}],\"outcomes\":[\"Build retrieval-augmented agents over your own documents and databases\",\"Design tool-calling and multi-step agent workflows that fail safely\",\"Evaluate agents with test suites, LLM judges and human review\",\"Deploy and monitor agents with cost, latency and safety budgets\"],\"audience\":\"Software engineers, data scientists and technical leads with at least one year of programming experience in Python.\",\"duration\":\"6 months\",\"weeklyEffort\":\"6 to 8 hours a week\",\"credits\":8,\"startDate\":\"2027-01-16\",\"applicationDeadline\":\"2026-11-30\",\"seats\":120,\"feeINR\":145000,\"applicationFeeINR\":1000,\"feeNote\":\"Plus 18% GST. Pay in up to three instalments. 10% off for IITH alumni and groups of three or more.\",\"applicationsOpen\":true,
